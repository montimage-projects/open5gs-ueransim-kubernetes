# Open5GS-compatible values for Towards5GS UERANSIM chart 2.0.17.
# The credentials below are public lab values, not production secrets.

global:
  # Local Minikube mode: use the pod network and Kubernetes services.
  # See docs/troubleshooting.md before enabling Multus N2/N3 networks.
  n2network:
    enabled: false
    name: n2network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.248
    cidr: 29
    gatewayIP: 10.100.50.254
    excludeIP: 10.100.50.254
  n3network:
    enabled: false
    name: n3network
    type: ipvlan
    masterIf: eth0
    subnetIP: 10.100.50.232
    cidr: 29
    gatewayIP: 10.100.50.238
    excludeIP: 10.100.50.238

projectName: ueransim

gnb:
  enabled: true
  n2if:
    ipAddress: 0.0.0.0
  n3if:
    ipAddress: 0.0.0.0
  amf:
    n2if:
      ipAddress: open5gs-amf-ngap
      port: 38412
    service:
      ngap:
        enabled: true
  configuration: |-
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    slices:
      - sst: 1
    ignoreStreamIds: true

ue:
  enabled: true
  configuration: |-
    supi: 'imsi-999700000000001'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'
    tunNetmask: '255.255.255.0'
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 1
    configured-nssai:
      - sst: 1
    default-nssai:
      - sst: 1
        sd: 1
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
