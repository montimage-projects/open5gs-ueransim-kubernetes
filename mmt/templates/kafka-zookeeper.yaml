---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
    - port: 2181
      targetPort: 2181
      protocol: TCP
      name: client
  selector:
    app: zookeeper
---
apiVersion: v1
kind: Pod
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  containers:
    - name: zookeeper
      image: ubuntu/zookeeper:edge
      ports:
        - containerPort: 2181
          name: client
          protocol: TCP


---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: NodePort
  ports:
    - port: 30092
      targetPort: 9092
      protocol: TCP
      nodePort: 30092
  selector:
    app: kafka
---

apiVersion: v1
kind: Pod
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  containers:
    - name: kafka
      image: ubuntu/kafka:edge
      env:
        - name: ZOOKEEPER_HOST
          value: zookeeper
        - name: ZOOKEEPER_PORT
          value: "2181"
      args:
        - "/etc/kafka/server.properties"
        - "--override"
        - "advertised.listeners=PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:30092"
        - "--override"
        - "log.retention.hours=1"
        - "--override"
        - "log.retention.bytes=134217728"
        - "--override"
        - "log.retention.check.interval.ms=10000"
      ports:
        - containerPort: 9092
          name: broker
          protocol: TCP
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1"
          ephemeral-storage: "1Gi"
          
          